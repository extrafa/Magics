name: Tests

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted(
              (k for k in devices if "SimRuntime.iOS-" in k),
              key=lambda k: [int(x) for x in k.split("iOS-")[1].split("-")],
          )
          print(next(d["udid"] for d in devices[runtimes[-1]] if d["name"] == "iPhone 17"))
          ')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build and test
        run: |
          xcodebuild test \
            -project MagicTricks.xcodeproj \
            -scheme Magics \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Coverage summary
        if: success()
        run: xcrun xccov view --report --only-targets TestResults.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
